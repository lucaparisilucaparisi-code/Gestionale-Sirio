[project]
name = "gestionale-sirio"
version = "1.0.0"
description = "Sirio OCR - lettura automatica dei fogli firma dell'Assistenza Specialistica e generazione della rendicontazione Excel"
requires-python = ">=3.10,<3.14"
dependencies = [
    "anthropic>=1.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.4",
    "xlsxwriter>=3.2",
    "platformdirs>=4.2",
    "keyring>=25.0",
]

[project.optional-dependencies]
# Motore OCR locale (offline): riconoscimento della scrittura a mano con TrOCR.
offline = [
    "torch>=2.4",
    "transformers>=4.44",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[tool.uv]
# Applicazione (non libreria): si avvia con "python -m sirio" dalla cartella del progetto.
package = false

# PyTorch solo CPU (evita il download dei pacchetti CUDA da diversi GB su Windows/Linux).
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
